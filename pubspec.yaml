name: fleetwise
description: "RENT.GOA is a sleek, mobile-first Flutter prototype for managing and monitoring a rental car fleet, featuring a clean Material 3 design, intuitive navigation, and rich visual data with sparkline charts for an effortless fleet management experience."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  fl_chart: ^1.1.1
  supabase_flutter: ^2.5.0
  uuid: ^4.5.2
  intl: ^0.20.2
  url_launcher: ^6.2.5
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_picker: ^1.0.7
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
