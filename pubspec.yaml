name: fleetwise
description: "RENT.GOA is a sleek, mobile-first Flutter prototype for managing and monitoring a rental car fleet, featuring a clean Material 3 design, intuitive navigation, and rich visual data with sparkline charts for an effortless fleet management experience."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  fl_chart: ^1.1.1
  supabase_flutter: ^2.5.0
  uuid: ^4.5.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/dreamflow_icon.jpg
  remove_alpha_ios: true
